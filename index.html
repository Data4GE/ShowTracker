<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Show Watching Platform</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 430 260'%3E%3Cdefs%3E%3Cmask id='cut'%3E%3Crect width='430' height='260' fill='white'/%3E%3Ccircle cx='236' cy='91' r='31' fill='black'/%3E%3Crect x='229' y='110' width='15' height='101' fill='black'/%3E%3C/mask%3E%3C/defs%3E%3Cg fill='%23D4AF37' mask='url(%23cut)'%3E%3Cpath d='M24 16 H320 V29 Q320 40 329 40 Q337 40 337 29 V16 H404 V67 H375 C338 67 312 78 298 105 C282 112 271 127 270 147 C269 167 285 181 324 193 V219 H328 V223 H136 V196 C169 188 191 170 191 147 C191 124 170 109 143 108 H126 V89 C77 75 42 53 24 25 Z'/%3E%3Cpath d='M136 194 H328 V223 H136 Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--red:#e50914;--bg:#101014;--panel:#1c1c23;--border:#383841}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f7f8;font-family:system-ui,Arial,sans-serif;padding:22px}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1250px;margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav a{color:white;background:var(--red);padding:10px 15px;text-decoration:none;border-radius:9px;font-weight:700}.nav-links{display:flex;gap:10px;flex-wrap:wrap}h1{color:#ff3540;margin:24px 0 16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}.btn{border:1px solid transparent;background:var(--red);color:white;border-radius:8px;padding:10px 13px}.btn:hover{filter:brightness(1.17)}.btn.alt{background:#292932;border-color:#45454f}.btn.small{padding:7px 9px;font-size:13px}.toolbar input{background:#23232b;color:white;border:1px solid #494952;border-radius:8px;padding:10px;min-width:210px;flex:1}.section{background:#17171c;border:1px solid var(--border);border-radius:14px;margin:18px 0;padding:16px}.section-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.section-head h2{font-size:20px;margin:0;flex:1;min-width:120px}.muted{color:#a4a4b0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px;min-height:40px}.card{background:#22222a;border:1px solid #3a3a43;border-radius:11px;padding:9px;min-width:0}.card.dragging{opacity:.45}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:7px;display:block;background:#333}.card-title{font-weight:700;margin:9px 0 5px;overflow-wrap:anywhere}.meta{font-size:12px;color:#bbb}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.actions .btn{flex:1}.handle{display:none;background:#41414b;color:#fff;border-radius:7px;text-align:center;padding:7px;cursor:grab;user-select:none;margin-bottom:8px}.reorder .handle{display:block}.reorder .poster{pointer-events:none}.empty{color:#999;font-size:14px;padding:10px 0}.hidden{display:none!important}.notice{color:#bcbcc6;font-size:13px;margin:10px 0 20px}dialog{border:1px solid #53535c;border-radius:13px;background:#202028;color:white;width:min(480px,calc(100% - 30px));padding:22px}dialog::backdrop{background:#000b}dialog h2{margin-top:0}form{display:grid;gap:12px}label{display:grid;gap:5px;font-size:14px}form input,form select{width:100%;background:#111118;border:1px solid #555560;color:white;padding:10px;border-radius:7px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}@media(max-width:500px){body{padding:12px}.section{padding:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:6px}.actions .btn{font-size:12px;padding:7px}.section-head h2{font-size:17px}}

:root{--poster-min:185px}.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--poster-min)),1fr))}.toolbar .search-box{min-width:190px}.size-control{display:flex;align-items:center;gap:8px;background:#23232b;border:1px solid #494952;padding:8px 12px;border-radius:8px;font-size:13px}.size-control input{min-width:0;flex:0;width:115px;accent-color:var(--red)}.bulk-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 18px;padding:12px;background:#24242e;border:1px solid #52525e;border-radius:10px}.bulk-bar select{background:#15151c;color:white;border:1px solid #555;padding:9px;border-radius:8px}.card .select-show{display:none;align-items:center;gap:5px;font-size:12px;margin-bottom:8px}.bulk-mode .card .select-show{display:flex}.card .select-show input{width:17px;height:17px;accent-color:var(--red)}.episode-line{font-size:12px;color:#ffb4b7;margin-top:5px}.card .actions .btn{min-width:55px}@media(max-width:500px){.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--poster-min)),1fr))}}
</style></head><body><main class="shell">
<div class="nav"><strong>SHOW WATCHING PLATFORM</strong><div class="nav-links"><a href="https://www.trackseries.tv/dashboard" target="_blank" rel="noopener noreferrer">Open TrackSeries ↗</a><a href="https://IMDb.arcadeanvil.com" target="_blank" rel="noopener noreferrer">Watch on IMDb ArcadeAnvil ↗</a></div></div>
<h1>My Shows</h1>
<div class="toolbar"><button class="btn" id="addShow">+ Add Show</button><button class="btn" id="addSection">+ New Section</button><button class="btn alt" id="reorder">Reorder Shows: Off</button><button class="btn alt" id="export">Export JSON</button><button class="btn alt" id="import">Import JSON</button><input class="search-box" id="search" placeholder="Search all sections…" aria-label="Search all sections"><label class="size-control">Poster size <input id="posterSize" type="range" min="115" max="290" step="5" value="185" aria-label="Poster size"><span id="sizeLabel">185px</span></label><button class="btn alt" id="bulkToggle">Select Shows: Off</button><input type="file" id="file" accept=".json,application/json" hidden></div>
<div id="bulkBar" class="bulk-bar hidden"><strong id="selectedCount">0 selected</strong><select id="bulkDestination" aria-label="Move selected shows to section"></select><button class="btn" id="moveSelected">Move Selected</button><button class="btn alt" id="selectAllVisible">Select Visible</button><button class="btn alt" id="clearSelection">Clear</button></div><div id="sections"></div><p class="notice">Section arrows change the section order. Turn on Reorder Shows to drag shows using their handles. Changes are saved in this browser; export a backup to move them elsewhere.</p>
</main>
<dialog id="showDialog"><form id="showForm"><h2 id="showDialogTitle">Add Show</h2><label>Title<input id="title" required maxlength="200"></label><label>Show URL<input id="link" type="url" required placeholder="https://..."></label><label>Poster image URL<input id="image" type="url" required placeholder="https://..."></label><label>Section<select id="sectionChoice"></select></label><label>Current season<input id="seasonNumber" type="number" min="0" max="9999" step="1" value="1"></label><label>Current episode<input id="episodeNumber" type="number" min="0" max="99999" step="1" value="1"></label><label>Status<select id="status"><option>Watching</option><option>Completed</option><option>Planned</option></select></label><div class="dialog-actions"><button class="btn alt" type="button" id="cancelShow">Cancel</button><button class="btn" type="submit">Save Show</button></div></form></dialog>
<dialog id="sectionDialog"><form id="sectionForm"><h2 id="sectionDialogTitle">New Section</h2><label>Section name<input id="sectionName" required maxlength="80" placeholder="e.g. Weekend Shows"></label><div class="dialog-actions"><button class="btn alt" type="button" id="cancelSection">Cancel</button><button class="btn" type="submit">Save Section</button></div></form></dialog>
<script>
'use strict';
const KEY='show-library-v2',OLD='shows',SIZE_KEY='show-library-poster-size';
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);
const isUrl=s=>{try{return ['https:','http:'].includes(new URL(s).protocol)}catch{return false}};
const validStatus=s=>['Watching','Completed','Planned'].includes(s)?s:'Planned';
const nonnegative=(value,fallback)=>Number.isInteger(Number(value))&&value!==null&&value!==undefined&&value!==''&&Number(value)>=0?Number(value):fallback;
function normalize(raw){
 if(!raw||typeof raw!=='object')throw Error('Invalid backup');
 if(Array.isArray(raw))raw={sections:[],shows:raw};
 if(!Array.isArray(raw.sections)||!Array.isArray(raw.shows))throw Error('Invalid backup');
 const sections=raw.sections.filter(s=>s&&typeof s.name==='string'&&s.name.trim()).map(s=>({id:uid(),name:s.name.trim().slice(0,80),collapsed:!!s.collapsed,oldId:s.id}));
 const sectionFor=id=>sections.find(s=>s.oldId===id)?.id||null;
 const shows=raw.shows.filter(s=>s&&typeof s.link==='string'&&typeof s.image==='string'&&isUrl(s.link)&&isUrl(s.image)).map(s=>({id:uid(),title:typeof s.title==='string'&&s.title.trim()?s.title.trim().slice(0,200):'Untitled Show',link:s.link,image:s.image,status:validStatus(s.status),favorite:!!s.favorite,season:nonnegative(s.season,1),episode:nonnegative(s.episode,1),sectionId:sectionFor(s.sectionId)}));
 sections.forEach(s=>delete s.oldId);
 return {sections,shows};
}
function read(){try{const value=localStorage.getItem(KEY);if(value)return JSON.parse(value);const old=localStorage.getItem(OLD);return old?normalize(JSON.parse(old)):{sections:[],shows:[]}}catch{return {sections:[],shows:[]}}}
let db=read(),editingShow=null,editingSection=null,reorder=false,dragId=null,bulkMode=false;const selected=new Set();
const displayTitle=s=>s.title||'Untitled Show';
function isDuplicate(link,ignoreId=null){return db.shows.some(s=>s.id!==ignoreId&&s.link.trim().replace(/\/$/,'').toLowerCase()===link.trim().replace(/\/$/,'').toLowerCase())}
function updateBulk(){selected.forEach(id=>{if(!db.shows.some(s=>s.id===id))selected.delete(id)});$('selectedCount').textContent=selected.size+' selected';$('bulkBar').classList.toggle('hidden',!bulkMode);document.body.classList.toggle('bulk-mode',bulkMode);const dest=$('bulkDestination'),previous=dest.value;dest.replaceChildren(new Option('Move to Unsorted',''));db.sections.forEach(s=>dest.add(new Option('Move to '+s.name,s.id)));if([...dest.options].some(o=>o.value===previous))dest.value=previous;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Unable to save. Check browser storage settings.')}}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function button(text,fn,cls='btn small alt'){const b=el('button',cls,text);b.type='button';b.addEventListener('click',fn);return b}
function moveSection(id,delta){const i=db.sections.findIndex(s=>s.id===id),j=i+delta;if(j<0||j>=db.sections.length)return;[db.sections[i],db.sections[j]]=[db.sections[j],db.sections[i]];save();render()}
function render(){updateBulk();const root=$('sections');root.replaceChildren();const q=$('search').value.trim().toLowerCase();const all=[...db.sections,{id:null,name:'Unsorted',collapsed:false}];
 all.forEach((section,si)=>{const box=el('section','section'),head=el('div','section-head');const count=db.shows.filter(s=>s.sectionId===section.id).length;
 head.append(button(section.collapsed?'▸':'▾',()=>{if(section.id!==null){section.collapsed=!section.collapsed;save()}else box.querySelector('.grid-wrap').classList.toggle('hidden');renderIfCustom(section.id)},'btn small alt'));
 const heading=el('h2','',section.name+'  ');heading.append(el('span','muted',`(${count})`));head.append(heading);
 if(section.id!==null){head.append(button('↑',()=>moveSection(section.id,-1)));head.append(button('↓',()=>moveSection(section.id,1)));head.append(button('Rename',()=>openSection(section.id)));head.append(button('Delete',()=>deleteSection(section.id)))}
 box.append(head);const wrap=el('div','grid-wrap');if(section.collapsed)wrap.classList.add('hidden');const grid=el('div','grid');grid.dataset.section=section.id??'';
 const items=db.shows.filter(s=>s.sectionId===section.id&&s.title.toLowerCase().includes(q));
 items.forEach(s=>grid.append(card(s)));
 if(!items.length)grid.append(el('p','empty',q?'No matching shows':'No shows here yet'));
 grid.addEventListener('dragover',e=>{if(reorder&&dragId){e.preventDefault();e.dataTransfer.dropEffect='move'}});
 grid.addEventListener('drop',e=>{if(!reorder||!dragId)return;e.preventDefault();const target=e.target.closest('.card');const source=db.shows.findIndex(s=>s.id===dragId);if(source<0)return;const [item]=db.shows.splice(source,1);item.sectionId=section.id;
 let pos=target?db.shows.findIndex(s=>s.id===target.dataset.id):-1;if(pos<0){const indices=db.shows.map((x,i)=>x.sectionId===section.id?i:-1).filter(i=>i>=0);pos=indices.length?indices[indices.length-1]+1:db.shows.length}else{const r=target.getBoundingClientRect();if(e.clientX>r.left+r.width/2||e.clientY>r.top+r.height*.7)pos++}db.shows.splice(pos,0,item);dragId=null;save();render()});
 wrap.append(grid);box.append(wrap);root.append(box)});
 function renderIfCustom(id){if(id!==null)render();else{const unsorted=[...root.children].at(-1);unsorted.querySelector('.grid-wrap').classList.toggle('hidden')}}
}
function card(s){const c=el('article','card');c.dataset.id=s.id;const choose=el('label','select-show');const check=el('input');check.type='checkbox';check.checked=selected.has(s.id);check.addEventListener('change',()=>{if(check.checked)selected.add(s.id);else selected.delete(s.id);updateBulk()});choose.append(check,document.createTextNode('Select'));c.append(choose);const handle=el('div','handle','☰ Drag to reorder');handle.draggable=reorder;handle.addEventListener('dragstart',e=>{dragId=s.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',s.id)});handle.addEventListener('dragend',()=>{dragId=null;c.classList.remove('dragging')});c.append(handle);
 const a=el('a','poster');a.href=s.link;a.target='_blank';a.rel='noopener noreferrer';const img=el('img');img.src=s.image;img.alt=s.title;img.loading='lazy';img.draggable=false;a.append(img);c.append(a);
 c.append(el('div','card-title',displayTitle(s)));c.append(el('div','meta',s.status));if(s.season!==undefined||s.episode!==undefined)c.append(el('div','episode-line',`Season ${nonnegative(s.season,1)} · Episode ${nonnegative(s.episode,1)}`));const actions=el('div','actions');actions.append(button(s.favorite?'★':'☆',()=>{s.favorite=!s.favorite;save();render()}),button('Edit',()=>openShow(s.id)),button('Remove',()=>{if(confirm(`Remove "${s.title}"?`)){db.shows=db.shows.filter(x=>x.id!==s.id);save();render()}}));c.append(actions);return c}
function openShow(id=null){editingShow=id;const s=db.shows.find(x=>x.id===id);$('showDialogTitle').textContent=s?'Edit Show':'Add Show';$('title').value=s?.title||'';$('link').value=s?.link||'';$('image').value=s?.image||'';$('status').value=s?.status||'Watching';$('seasonNumber').value=nonnegative(s?.season,1);$('episodeNumber').value=nonnegative(s?.episode,1);const select=$('sectionChoice');select.replaceChildren();select.add(new Option('Unsorted',''));db.sections.forEach(x=>select.add(new Option(x.name,x.id)));select.value=s?.sectionId||'';$('showDialog').showModal()}
$('showForm').addEventListener('submit',e=>{e.preventDefault();const title=$('title').value.trim(),link=$('link').value.trim(),image=$('image').value.trim();if(!isUrl(link)||!isUrl(image)){alert('Use valid http or https URLs.');return}if(isDuplicate(link,editingShow)){alert('This show link is already in your library. You can edit the existing show instead.');return}const season=nonnegative($('seasonNumber').value,1),episode=nonnegative($('episodeNumber').value,1);const s=db.shows.find(x=>x.id===editingShow);if(s)Object.assign(s,{title,link,image,season,episode,status:$('status').value,sectionId:$('sectionChoice').value||null});else db.shows.push({id:uid(),title,link,image,season,episode,status:$('status').value,sectionId:$('sectionChoice').value||null,favorite:false});save();$('showDialog').close();render()});
function openSection(id=null){editingSection=id;$('sectionDialogTitle').textContent=id?'Rename Section':'New Section';$('sectionName').value=db.sections.find(s=>s.id===id)?.name||'';$('sectionDialog').showModal()}
$('sectionForm').addEventListener('submit',e=>{e.preventDefault();const name=$('sectionName').value.trim();if(!name)return;const s=db.sections.find(x=>x.id===editingSection);if(s)s.name=name;else db.sections.push({id:uid(),name,collapsed:false});save();$('sectionDialog').close();render()});
function deleteSection(id){const s=db.sections.find(x=>x.id===id);if(!s)return;const count=db.shows.filter(x=>x.sectionId===id).length;if(!confirm(`Delete section "${s.name}"? ${count} show(s) will move to Unsorted; none will be deleted.`))return;db.shows.forEach(x=>{if(x.sectionId===id)x.sectionId=null});db.sections=db.sections.filter(x=>x.id!==id);save();render()}
$('addShow').onclick=()=>openShow();$('addSection').onclick=()=>openSection();$('cancelShow').onclick=()=>$('showDialog').close();$('cancelSection').onclick=()=>$('sectionDialog').close();$('search').addEventListener('input',render);
$('bulkToggle').onclick=()=>{bulkMode=!bulkMode;if(!bulkMode)selected.clear();$('bulkToggle').textContent='Select Shows: '+(bulkMode?'On':'Off');render()};
$('selectAllVisible').onclick=()=>{const q=$('search').value.trim().toLowerCase();db.shows.filter(s=>displayTitle(s).toLowerCase().includes(q)).forEach(s=>selected.add(s.id));render()};
$('clearSelection').onclick=()=>{selected.clear();render()};
$('moveSelected').onclick=()=>{if(!selected.size){alert('Select at least one show first.');return}const target=$('bulkDestination').value||null;db.shows.forEach(s=>{if(selected.has(s.id))s.sectionId=target});const count=selected.size;selected.clear();save();render();alert(count+' show(s) moved.');};
const savedSize=Number(localStorage.getItem(SIZE_KEY));if(Number.isFinite(savedSize)&&savedSize>=115&&savedSize<=290)$('posterSize').value=savedSize;function applySize(){const size=$('posterSize').value;document.documentElement.style.setProperty('--poster-min',size+'px');$('sizeLabel').textContent=size+'px';try{localStorage.setItem(SIZE_KEY,size)}catch{}}$('posterSize').addEventListener('input',applySize);applySize();
$('reorder').onclick=()=>{reorder=!reorder;$('reorder').textContent='Reorder Shows: '+(reorder?'On':'Off');$('reorder').classList.toggle('alt',!reorder);document.body.classList.toggle('reorder',reorder);render()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='show-library-backup.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const incoming=normalize(JSON.parse(await file.text()));if(!confirm('Import will replace your current library. Export a backup first if needed. Continue?'))return;db=incoming;save();render();alert('Import complete.')}catch(err){alert('Could not import this JSON file.')}finally{e.target.value=''}};
render();
</script></body></html>
